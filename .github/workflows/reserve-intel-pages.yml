name: Deploy Reserve Intel Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/reserve-intel/**"
      - "automation/generate_review_dashboard.py"
      - "drafts/pending/**"
      - "reserve-content-feed.json"
      - ".github/workflows/reserve-intel-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reserve-intel-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate dashboard data
        run: |
          python automation/generate_review_dashboard.py \
            --main-ref HEAD \
            --output docs/reserve-intel/data.json

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/reserve-intel
          cp docs/reserve-intel/index.html _site/reserve-intel/index.html
          cat docs/reserve-intel/app.js > _site/reserve-intel/app.js
          printf '\n' >> _site/reserve-intel/app.js
          cat docs/reserve-intel/auth.js >> _site/reserve-intel/app.js
          printf '\n' >> _site/reserve-intel/app.js
          cat docs/reserve-intel/published-github-edit.js >> _site/reserve-intel/app.js

          # GitHub Pages is a hosted/read-only dashboard surface. The local
          # Codespace review-service health check must not block initial data
          # rendering there. Keep the original behavior unchanged for local use.
          python - <<'PY'
          from pathlib import Path

          path = Path("_site/reserve-intel/app.js")
          text = path.read_text(encoding="utf-8")
          old = '''async function load() {
            try {
              await checkSaveService();

              let data = null;'''
          new = '''async function load() {
            try {
              if (window.location.hostname.endsWith("github.io")) {
                state.saveServiceAvailable = false;
                state.rejectServiceAvailable = false;
                state.approveServiceAvailable = false;
                state.refreshServiceAvailable = false;
                state.saveServiceRepository = null;
                const hostedStatus = byId("save-service-status");
                hostedStatus.textContent = "GitHub-hosted dashboard";
                hostedStatus.className = "service-status connected";
              } else {
                await checkSaveService();
              }

              let data = null;'''
          if old not in text:
              raise SystemExit("Hosted load() patch target was not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cp docs/reserve-intel/styles.css _site/reserve-intel/styles.css
          cp docs/reserve-intel/data.json _site/reserve-intel/data.json

          # Serve the actual dashboard at the Pages root too. This avoids
          # relying on browser/meta-refresh behavior before the app loads.
          cp _site/reserve-intel/index.html _site/index.html
          cp _site/reserve-intel/app.js _site/app.js
          cp _site/reserve-intel/styles.css _site/styles.css
          cp _site/reserve-intel/data.json _site/data.json

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
