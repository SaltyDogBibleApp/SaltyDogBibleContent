name: Reserve Intel Review PR

on:
  workflow_run:
    workflows: ["Reserve Intel Monitor"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reserve-intel-review-pr
  cancel-in-progress: false

jobs:
  create-review-prs:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install enrichment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements-enrichment.txt

      - name: Validate pending drafts
        run: |
          python automation/validate_drafts.py drafts/pending

      - name: Create human-readable review PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          DRAFTS=(drafts/pending/*.json)

          if [ ${#DRAFTS[@]} -eq 0 ]; then
            echo "No pending Reserve Intel drafts."
            exit 0
          fi

          gh label create reserve-intel-review \
            --color 0969DA \
            --description "Human review required before Reserve Intel publication" \
            2>/dev/null || true

          git config user.name "reserve-intel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp automation/check_sources.py /tmp/check_sources.py
          cp automation/enrich_navadmin_draft.py /tmp/enrich_navadmin_draft.py
          cp automation/enrich_pay_tables_draft.py /tmp/enrich_pay_tables_draft.py
          cp automation/shape_navadmin_article.py /tmp/shape_navadmin_article.py
          cp automation/validate_drafts.py /tmp/validate_drafts.py
          cp automation/prepare_review_pr.py /tmp/prepare_review_pr.py

          python /tmp/enrich_pay_tables_draft.py --self-test

          for DRAFT in "${DRAFTS[@]}"; do
            ARTICLE_ID="$(basename "$DRAFT" .json)"
            BRANCH="reserve-intel-review/${ARTICLE_ID}"

            OPEN_PR="$(gh pr list \
              --state open \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number // empty')"

            PRIOR_PR_COUNT="$(gh pr list \
              --state all \
              --head "$BRANCH" \
              --json number \
              --jq 'length')"

            if [ -n "$OPEN_PR" ]; then
              echo "Open review PR #${OPEN_PR} already exists for ${ARTICLE_ID}."

              git fetch origin "$BRANCH"
              git switch -C "$BRANCH" "origin/$BRANCH"

              SOURCE_TYPE="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print((p.get("sourceEvidence") or {}).get("sourceType",""))' "$DRAFT")"

              if [ -z "$SOURCE_TYPE" ]; then
                echo "Draft is missing sourceEvidence.sourceType: $DRAFT"
                exit 1
              fi

              if [ "$SOURCE_TYPE" = "pay_tables" ]; then
                ALREADY_PAY_ENRICHED="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); e=p.get("enrichment"); print("true" if isinstance(e,dict) and e.get("sourceType")=="pay_tables" else "false")' "$DRAFT")"

                if [ "$ALREADY_PAY_ENRICHED" = "true" ]; then
                  echo "Existing DFAS pay-table review PR is already enriched; leaving it unchanged."
                  git switch main
                  git reset --hard origin/main
                  continue
                fi

                echo "Upgrading existing DFAS pay-table review PR with source-grounded enrichment."
                python /tmp/enrich_pay_tables_draft.py \
                  --draft "$DRAFT"

                python /tmp/validate_drafts.py "$DRAFT"

                REVIEW_FILE="reviews/pending/${ARTICLE_ID}.md"
                META_FILE="/tmp/${ARTICLE_ID}-metadata.json"

                python /tmp/prepare_review_pr.py \
                  --draft "$DRAFT" \
                  --output "$REVIEW_FILE" \
                  --metadata "$META_FILE"

                TITLE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$META_FILE")"

                git add "$DRAFT" "$REVIEW_FILE"

                if ! git diff --cached --quiet; then
                  git commit -m "Enrich Reserve Intel review for ${ARTICLE_ID}"
                  git push --force-with-lease origin "$BRANCH"
                fi

                gh pr edit "$OPEN_PR" \
                  --title "Reserve Intel Review: ${TITLE}" \
                  --body-file "$REVIEW_FILE"

                git switch main
                git reset --hard origin/main
                continue
              fi

              if [ "$SOURCE_TYPE" != "navadmin" ]; then
                echo "Open manual-review PR #${OPEN_PR} already exists for source type ${SOURCE_TYPE}; leaving it unchanged."
                git switch main
                git reset --hard origin/main
                continue
              fi

              ALREADY_ENRICHED="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print("true" if isinstance(p.get("enrichment"), dict) else "false")' "$DRAFT")"
              ALREADY_SHAPED="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print("true" if isinstance(p.get("shaping"), dict) else "false")' "$DRAFT")"

              if [ "$ALREADY_SHAPED" = "true" ]; then
                echo "Existing NAVADMIN review PR is already shaped; leaving it unchanged."
                git switch main
                git reset --hard origin/main
                continue
              fi

              if [ "$ALREADY_ENRICHED" != "true" ]; then
                echo "Upgrading existing NAVADMIN review PR with source-grounded enrichment."
                python /tmp/enrich_navadmin_draft.py \
                  --draft "$DRAFT"
              else
                echo "Existing NAVADMIN review PR is already enriched."
              fi

              echo "Applying human-friendly NAVADMIN article shaping."
              python /tmp/shape_navadmin_article.py \
                --draft "$DRAFT"

              python /tmp/validate_drafts.py "$DRAFT"

              REVIEW_FILE="reviews/pending/${ARTICLE_ID}.md"
              META_FILE="/tmp/${ARTICLE_ID}-metadata.json"

              python /tmp/prepare_review_pr.py \
                --draft "$DRAFT" \
                --output "$REVIEW_FILE" \
                --metadata "$META_FILE"

              TITLE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$META_FILE")"

              git add "$DRAFT" "$REVIEW_FILE"

              if ! git diff --cached --quiet; then
                git commit -m "Shape Reserve Intel review for ${ARTICLE_ID}"
                git push --force-with-lease origin "$BRANCH"
              fi

              gh pr edit "$OPEN_PR" \
                --title "Reserve Intel Review: ${TITLE}" \
                --body-file "$REVIEW_FILE"

              git switch main
              git reset --hard origin/main
              continue
            fi

            if [ "$PRIOR_PR_COUNT" != "0" ]; then
              echo "A prior closed/merged review exists for ${ARTICLE_ID}; skipping."
              continue
            fi

            git switch -C "$BRANCH" origin/main

            SOURCE_TYPE="$(python -c 'import json,sys; p=json.load(open(sys.argv[1])); print((p.get("sourceEvidence") or {}).get("sourceType",""))' "$DRAFT")"

            if [ -z "$SOURCE_TYPE" ]; then
              echo "Draft is missing sourceEvidence.sourceType: $DRAFT"
              exit 1
            fi

            if [ "$SOURCE_TYPE" = "navadmin" ]; then
              python /tmp/enrich_navadmin_draft.py \
                --draft "$DRAFT"

              python /tmp/shape_navadmin_article.py \
                --draft "$DRAFT"
            elif [ "$SOURCE_TYPE" = "pay_tables" ]; then
              python /tmp/enrich_pay_tables_draft.py \
                --draft "$DRAFT"
            else
              echo "No automated enrichment/shaping is configured for source type ${SOURCE_TYPE}."
              echo "Creating a manual-review PR from the validated pending draft."
            fi

            python /tmp/validate_drafts.py "$DRAFT"

            REVIEW_FILE="reviews/pending/${ARTICLE_ID}.md"
            META_FILE="/tmp/${ARTICLE_ID}-metadata.json"

            python /tmp/prepare_review_pr.py \
              --draft "$DRAFT" \
              --output "$REVIEW_FILE" \
              --metadata "$META_FILE"

            TITLE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["title"])' "$META_FILE")"

            git add "$DRAFT" "$REVIEW_FILE"

            if [ "$SOURCE_TYPE" = "navadmin" ]; then
              git commit -m "Create shaped Reserve Intel review for ${ARTICLE_ID}"
            elif [ "$SOURCE_TYPE" = "pay_tables" ]; then
              git commit -m "Create enriched Reserve Intel review for ${ARTICLE_ID}"
            else
              git commit -m "Create manual Reserve Intel review for ${ARTICLE_ID}"
            fi

            git push --force-with-lease origin "$BRANCH"

            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Reserve Intel Review: ${TITLE}" \
              --body-file "$REVIEW_FILE" \
              --label reserve-intel-review \
              --draft

            git switch main
            git reset --hard origin/main
          done

